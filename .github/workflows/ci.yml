name: CI / CD for Expo React Native

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]

permissions:
    contents: write # для semantic-release та створення тегів
    issues: write
    pull-requests: write

jobs:
    lint:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: "20" # Expo 54 рекомендує LTS, 20 або 22
                  cache: "npm"

            - name: Install dependencies
              run: npm ci

            - name: Run ESLint
              run: npm run lint

            - name: Run Prettier check
              run: npm run prettier:check

    build-and-test:
        needs: lint
        runs-on: ubuntu-latest
        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: "20"
                  cache: "npm"

            - name: Install dependencies
              run: npm ci

            - name: Run tests
              run: npm test -- --passWithNoTests

            - name: Expo prebuild (Android)
              run: npx expo prebuild --platform android --clean

            - name: Build Expo web (якщо потрібно)
              run: npx expo export --platform web

            - name: Upload web artifact (опціонально)
              if: always()
              uses: actions/upload-artifact@v4
              with:
                  name: web-dist
                  path: dist/
                  retention-days: 7

    eas-build-development:
        needs: build-and-test
        runs-on: ubuntu-latest
        if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: "20"
                  cache: "npm"

            - name: Install EAS CLI
              run: npm install -g eas-cli

            - name: Install dependencies
              run: npm ci

            - name: Login to Expo
              env:
                  EXPO_USERNAME: ${{ secrets.EXPO_USERNAME }}
                  EXPO_PASSWORD: ${{ secrets.EXPO_PASSWORD }}
              run: eas login --non-interactive

            - name: Build Development APK
              run: eas build --platform android --profile development --non-interactive --no-wait

    release:
        needs: eas-build-development
        runs-on: ubuntu-latest
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        steps:
            - name: Checkout repository with full history
              uses: actions/checkout@v4
              with:
                  fetch-depth: 0

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: "20"
                  cache: "npm"

            - name: Install dependencies
              run: npm ci

            - name: Semantic Release
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: npx semantic-release

            - name: Create EAS Production Build (after release)
              if: success()
              env:
                  EXPO_USERNAME: ${{ secrets.EXPO_USERNAME }}
                  EXPO_PASSWORD: ${{ secrets.EXPO_PASSWORD }}
              run: |
                  eas login
                  eas build --platform android --profile production --non-interactive --no-wait
