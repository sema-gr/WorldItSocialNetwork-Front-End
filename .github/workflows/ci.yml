name: CI / CD (Production)

on:
    push:
        branches: [main]

permissions:
    contents: write
    issues: write
    pull-requests: write

jobs:
    lint-and-test:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - uses: actions/setup-node@v4
              with:
                  node-version: "20"
                  cache: "npm"

            - run: npm ci
            - run: npm run lint
            - run: npm run prettier:check
            - run: npm test -- --passWithNoTests

    build-web-and-deploy:
        needs: lint-and-test
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - uses: actions/setup-node@v4
              with:
                  node-version: "20"
                  cache: "npm"

            - run: npm ci

            - name: Build Expo Web
              run: npx expo export -p web

            - name: Deploy Web to Vercel (Production)
              id: vercel_deploy
              env:
                  VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
                  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
                  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
              run: |
                  npm install -g vercel
                  URL=$(vercel deploy dist --prod --token=$VERCEL_TOKEN | tail -n 1)
                  echo "url=$URL" >> $GITHUB_OUTPUT

            - name: Deployment URL
              run: |
                  echo "🌍 Web deployed to: ${{ steps.vercel_deploy.outputs.url }}"

    build-android-prod:
        needs: lint-and-test
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - uses: actions/setup-node@v4
              with:
                  node-version: "20"
                  cache: "npm"

            - run: npm ci
            - run: npm install -g eas-cli

            - name: Run EAS Android Production Build
              env:
                  EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
              run: |
                  eas build --platform android --profile production --non-interactive --json > build.json

            - name: Upload Android Artifact
              uses: actions/upload-artifact@v4
              with:
                  name: android-build
                  path: build.json
                  retention-days: 14

    release:
        needs:
            - build-web-and-deploy
            - build-android-prod
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
              with:
                  fetch-depth: 0

            - uses: actions/setup-node@v4
              with:
                  node-version: "20"
                  cache: "npm"

            - run: npm ci

            - name: Semantic Release
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: npx semantic-release
